<div class="table-wrap"><table><thead><tr><th>Date</th><th>Type</th><th>Description</th><th>Amount</th></tr></thead><tbody>{% for r in records %}<tr><td>{{ r.record_date }}</td><td>{{ r.get_record_type_display }}</td><td>{{ r.description }}</td><td>UGX {{ r.amount|floatformat:2 }}</td></tr>{% empty %}<tr><td colspan="4" class="empty">No records yet.</td></tr>{% endfor %}</tbody></table></div>
